<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact page with a form and localStorage draft saving.">
  <meta name="author" content="Armando Rebaza">
  <title>Peru Travel Guide | Contact</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/site.css">
  <script src="scripts/app.js" defer></script>
  <script src="scripts/form.js" defer></script>
  <script src="scripts/footer.js" defer></script>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-grid">
      <div>
        <h1 class="title-flag">
          <span data-i18n="contactTitle">Contact</span>
          <img class="flag" src="images/peru-flag.svg" loading="lazy" alt="Peru flag">
        </h1>
        <p class="tagline" data-i18n="contactTagline">Send me your questions or travel ideas.</p>
      </div>
      <div class="badge" data-i18n="badgePeru">Peru</div>
    </div>

    <nav class="nav" aria-label="Primary navigation">
      <div class="wrap nav-grid">
        <a class="nav-brand" href="index.html" data-i18n="navHome">Home</a>

        <div class="nav-links">
          <a href="places.html" data-i18n="navPlaces">Places</a>
          <a href="food.html" data-i18n="navFood">Food</a>
          <a href="history.html" data-i18n="navHistory">History</a>
          <a class="active" href="contact.html" data-i18n="navContact">Contact</a>
          <a href="references.html" data-i18n="navReferences">References</a>
        </div>

        <div class="lang">
          <label for="langSelect" data-i18n="langLabel">Lang</label>
          <select id="langSelect" name="langSelect">
            <option value="en">EN</option>
            <option value="es">ES</option>
            <option value="fr">FR</option>
          </select>
        </div>
      </div>
    </nav>
  </header>

  <main id="main" class="wrap">
    <section class="card">
      <h2 class="card-title" data-i18n="contactFormTitle">Contact Form</h2>
      <p class="muted" data-i18n="contactFormDesc">Your draft saves automatically while you type.</p>

      <form id="formContacto" action="thanks.html" method="get">
        <div class="field">
          <label for="nombre"><span data-i18n="nameLabel">Name</span> <span class="req">*</span></label>
          <input id="nombre" name="nombre" type="text" required autocomplete="name">
        </div>

        <div class="field">
          <label for="correo"><span data-i18n="emailLabel">Email</span> <span class="req">*</span></label>
          <input id="correo" name="correo" type="email" required autocomplete="email">
        </div>

        <fieldset class="field">
          <legend data-i18n="tripTypeLegend">Trip Type</legend>
          <div class="inline">
            <label><input type="radio" name="tipoViaje" value="family" required> <span data-i18n="tripFamily">Family</span></label>
            <label><input type="radio" name="tipoViaje" value="solo"> <span data-i18n="tripSolo">Solo</span></label>
            <label><input type="radio" name="tipoViaje" value="couple"> <span data-i18n="tripCouple">Couple</span></label>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend data-i18n="interestsLegend">Interests</legend>
          <div class="inline">
            <label><input type="checkbox" name="intereses" value="food"> <span data-i18n="interestFood">Food</span></label>
            <label><input type="checkbox" name="intereses" value="history"> <span data-i18n="interestHistory">History</span></label>
            <label><input type="checkbox" name="intereses" value="nature"> <span data-i18n="interestNature">Nature</span></label>
          </div>
        </fieldset>

        <div class="field">
          <label for="comentarios" data-i18n="messageLabel">Message</label>
          <textarea id="comentarios" name="comentarios" rows="5"></textarea>
        </div>

        <div class="actions">
          <button class="btn" type="submit" data-i18n="sendBtn">Send</button>
          <button class="btn ghost" type="button" id="btnBorrar" data-i18n="clearDraftBtn">Clear Draft</button>
        </div>

        <p class="muted" id="estadoForm" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <p>&copy; <span id="year"></span> Armando Rebaza</p>
      <p class="muted"><span data-i18n="lastMod">Last Modification:</span> <span id="lastModified"></span></p>
      <p><a href="references.html" data-i18n="navReferences">References</a></p>
    </div>
  </footer>
</body>
</html>
