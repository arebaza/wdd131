<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
        content="WDD 131 Week 05 Product Review Form where users select a product, rate it, add an installation date, and submit feedback.">
  <meta name="author" content="Armando Rebaza">
  <title>Product Review Form</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
  <script src="scripts/footer.js" defer></script>
</head>

<body>
  <header class="site-header">
    <div class="wrap header-grid">
      <div>
        <h1>Product Review</h1>
        <p class="tagline">Share your experience to help others.</p>
      </div>

      <!-- ✅ FIX: aria-label REMOVED (valid HTML) -->
      <div class="badge">W05</div>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <h2 class="card-title">Review Form</h2>

      <form method="get" action="review.html">
        <!-- Product Name -->
        <div class="field">
          <label for="productName">
            Product Name <span class="req">*</span>
          </label>
          <select id="productName" name="productName" required>
            <option value="" disabled selected>Select a Product ...</option>
          </select>
        </div>

        <!-- Rating -->
        <fieldset class="field">
          <legend>Overall Rating <span class="req">*</span></legend>

          <input type="radio" id="r1" name="rating" value="1" required>
          <label for="r1">1</label>

          <input type="radio" id="r2" name="rating" value="2" required>
          <label for="r2">2</label>

          <input type="radio" id="r3" name="rating" value="3" required>
          <label for="r3">3</label>

          <input type="radio" id="r4" name="rating" value="4" required>
          <label for="r4">4</label>

          <input type="radio" id="r5" name="rating" value="5" required>
          <label for="r5">5</label>
        </fieldset>

        <!-- Date -->
        <div class="field">
          <label for="installDate">
            Date of Installation <span class="req">*</span>
          </label>
          <input type="date" id="installDate" name="installDate" required>
        </div>

        <!-- Features -->
        <fieldset class="field">
          <legend>Useful Features</legend>

          <input type="checkbox" id="durability" name="features" value="Durability">
          <label for="durability">Durability</label>

          <input type="checkbox" id="ease" name="features" value="Ease of Use">
          <label for="ease">Ease of Use</label>

          <input type="checkbox" id="performance" name="features" value="Performance">
          <label for="performance">Performance</label>

          <input type="checkbox" id="design" name="features" value="Design">
          <label for="design">Design</label>
        </fieldset>

        <!-- Review -->
        <div class="field">
          <label for="writtenReview">Written Review</label>
          <textarea id="writtenReview" name="writtenReview"></textarea>
        </div>

        <!-- Name -->
        <div class="field">
          <label for="userName">Your Name</label>
          <input type="text" id="userName" name="userName">
        </div>

        <input class="btn" type="submit" value="Post Review">
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <p>&copy; <span id="year"></span> Armando Rebaza</p>
      <p class="muted">Last Modification: <span id="lastModified"></span></p>
    </div>
  </footer>
</body>
</html>
