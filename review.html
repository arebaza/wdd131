<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
        content="WDD 131 Week 05 review confirmation page that tracks the number of completed reviews using localStorage.">
  <meta name="author" content="Armando Rebaza">
  <title>Review Submitted</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/review.js" defer></script>
  <script src="scripts/footer.js" defer></script>
</head>

<body>
  <header class="site-header">
    <div class="wrap header-grid">
      <div>
        <h1>Thank You!</h1>
        <p class="tagline">Your review has been submitted successfully.</p>
      </div>
      <div class="badge">✔</div>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <h2 class="card-title">Submission Confirmation</h2>

      <p class="confirm">
        Total reviews completed on this browser:
        <strong><span id="reviewCount">0</span></strong>
      </p>

      <ul id="reviewSummary"></ul>

      <a class="btn link-btn" href="form.html">Submit Another Review</a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <p>&copy; <span id="year"></span> Armando Rebaza</p>
      <p class="muted">Last Modification: <span id="lastModified"></span></p>
    </div>
  </footer>
</body>
</html>
